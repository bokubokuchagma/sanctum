<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading... | The First Elden Lord</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    #reader-content { opacity: 0; transition: opacity 0.4s ease; }
    #reader-content.loaded { opacity: 1; }
    .loading-spinner { text-align: center; padding: 5rem 1rem; color: var(--gold-primary); font-family: var(--font-display); font-size: 1.1rem; }
  </style>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('webfiction_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>

  <!-- Reading Progress Bar -->
  <div class="reading-progress-container" aria-hidden="true">
    <div class="reading-progress-bar"></div>
  </div>

  <header class="site-header">
    <div class="container-wide site-nav">
      <a href="./index.html" class="site-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2L15 9H9L12 2M12 22L9 15H15L12 22M2 12L9 9V15L2 12M22 12L15 15V9L22 12Z"/>
        </svg>
        <span>ELDEN LORD</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./archive.html">Archive</a></li>
          <li>
            <button class="theme-toggle-btn" aria-label="Toggle Theme">
              <span aria-hidden="true">☼</span>
              <span>Theme</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="reader-toolbar">
      <div class="breadcrumb-nav">
        <a href="./index.html">Chronicles</a> &rsaquo;
        <a href="./archive.html">Saga of Godfrey</a> &rsaquo;
        <span id="breadcrumb-chapter">Loading chapter...</span>
      </div>
    </div>

    <div id="loading" class="loading-spinner">◈ Communing with the Golden Grace...</div>

    <div id="reader-content">
      <article class="prose" id="markdown-body">
        <!-- Rendered Story Content -->
      </article>

      <nav class="chapter-nav-pager" aria-label="Chapter Pagination">
        <a href="./archive.html" class="nav-pager-link prev" id="nav-prev">
          <span class="nav-pager-label">&larr; Previous</span>
          <span class="nav-pager-title">Archive</span>
        </a>
        <a href="#" class="nav-pager-link next" id="nav-next" style="display:none;">
          <span class="nav-pager-label">Next Chapter &rarr;</span>
          <span class="nav-pager-title">Continue</span>
        </a>
      </nav>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-quote">&ldquo;A crown is warranted with strength.&rdquo;</p>
      <p>&copy; 2026 The First Elden Lord Chronicles. Hosted on GitHub Pages.</p>
    </div>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const chapterId = urlParams.get('ch') || 'ch-01';
      
      try {
        const response = await fetch(`./chapters/${chapterId}.md`);
        if (!response.ok) throw new Error('Markdown not reachable');
        const text = await response.text();
        
        let pageTitle = 'Chapter';
        const h1Match = text.match(/^#\s+(.+)$/m);
        if (h1Match) {
          pageTitle = h1Match[1].trim();
        }

        // Setup custom renderer compatible with both marked v4 and v12+
        const renderer = new marked.Renderer();
        renderer.hr = function() {
          return '<div class="scene-break"><span>✦ &nbsp; ❖ &nbsp; ✦</span></div>';
        };
        renderer.image = function(token, title, text) {
          const href = (typeof token === 'object' && token !== null) ? token.href : token;
          const alt = (typeof token === 'object' && token !== null) ? (token.text || '') : (text || '');
          return `<figure>
            <img src="${href}" alt="${alt}" loading="lazy">
            ${alt ? `<figcaption>${alt}</figcaption>` : ''}
          </figure>`;
        };
        
        if (typeof marked.use === 'function') {
          marked.use({ renderer, gfm: true, breaks: true });
        } else if (typeof marked.setOptions === 'function') {
          marked.setOptions({ renderer, gfm: true, breaks: true });
        }

        document.title = `${pageTitle} | The First Elden Lord`;
        document.getElementById('breadcrumb-chapter').textContent = pageTitle;
        document.getElementById('markdown-body').innerHTML = marked.parse(text);
        
        // Dynamic Pagination logic
        const match = chapterId.match(/ch-(\d+)/);
        if (match) {
          const num = parseInt(match[1]);
          
          if (num > 1) {
            const prevId = 'ch-' + String(num - 1).padStart(2, '0');
            const prevLink = document.getElementById('nav-prev');
            prevLink.href = `./chapters/${prevId}.html`;
            prevLink.querySelector('.nav-pager-title').textContent = `Chapter ${num - 1}`;
          }
          
          if (num < 5) {
            const nextId = 'ch-' + String(num + 1).padStart(2, '0');
            const nextLink = document.getElementById('nav-next');
            nextLink.style.display = 'flex';
            nextLink.href = `./chapters/${nextId}.html`;
            nextLink.querySelector('.nav-pager-title').textContent = `Chapter ${num + 1}`;
          }
        }
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('reader-content').classList.add('loaded');

      } catch (e) {
        // Fallback: If fetch is blocked (e.g. file:// CORS) or missing, redirect to the pre-rendered HTML chapter
        window.location.replace(`./chapters/${chapterId}.html`);
      }
    });
  </script>
</body>
</html>
